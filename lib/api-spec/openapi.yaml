        - name: bookId
          in: path
          required: true
          schema:
            type: string
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Card deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Card not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/{bookId}/study/review:
    get:
      operationId: getReviewQueue
      tags: [study]
      summary: Get review queue
      description: Returns cards that are due for review (or all cards if requested)
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
        - name: deckId
          in: query
          required: false
          schema:
            type: string
        - name: all
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Cards ready for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardReviewQueueResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/{bookId}/study/cards/{cardId}/review:
    post:
      operationId: submitCardReview
      tags: [study]
      summary: Submit flashcard review rating
      description: Records user review rating and computes next repetition schedule
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitCardReviewRequest"
      responses:
        "200":
          description: Review recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardReviewResult"
        "400":
          description: Invalid rating
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Card not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/{bookId}/study/sessions:
    post:
      operationId: startStudySession
      tags: [study]
      summary: Start a study session
      description: Begins a new review session
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartStudySessionRequest"
      responses:
        "201":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySession"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/{bookId}/study/sessions/{sessionId}/complete:
    patch:
      operationId: completeStudySession
      tags: [study]
      summary: Complete study session
      description: Finalizes counters and marks session completed
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteStudySessionRequest"
      responses:
        "200":
          description: Session completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySession"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
        timestamp:
          type: string
      required:
        - status

    ReadinessStatus:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
        timestamp:
          type: string
      required:
        - status
        - database

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        displayName:
          type: string
      required:
        - email
        - password

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: string
        createdAt:
          type: string
      required:
        - id
        - email

    UserPreferences:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        language:
          type: string
          enum: [es-MX, en-US]
        theme:
          type: string
          enum: [light, dark, system]
        readingMode:
          type: string
          enum: [standard, study, speed]
        fontSize:
          type: string
          enum: [small, medium, large, x-large]
        readerViewMode:
          type: string
          enum: [auto, reading, original]
        readerLayout:
          type: string
          enum: [single, double, continuous]
        readerTheme:
          type: string
          enum: [paper, sepia, night]
        readerFontFamily:
          type: string
          enum: [serif, sans]
        readerFontSize:
          type: integer
        readerLineHeight:
          type: string
          enum: [compact, normal, relaxed]
        readerMargin:
          type: string
          enum: [narrow, normal, wide]
        readerPageAnimation:
          type: string
          enum: [page, slide, none]
        readerZoom:
          type: integer
        updatedAt:
          type: string
      required:
        - id
        - userId
        - language
        - theme

    UpdatePreferencesRequest:
      type: object
      properties:
        language:
          type: string
          enum: [es-MX, en-US]
        theme:
          type: string
          enum: [light, dark, system]
        readingMode:
          type: string
          enum: [standard, study, speed]
        fontSize:
          type: string
          enum: [small, medium, large, x-large]
        readerViewMode:
          type: string
          enum: [auto, reading, original]
        readerLayout:
          type: string
          enum: [single, double, continuous]
        readerTheme:
          type: string
          enum: [paper, sepia, night]
        readerFontFamily:
          type: string
          enum: [serif, sans]
        readerFontSize:
          type: integer
        readerLineHeight:
          type: string
          enum: [compact, normal, relaxed]
        readerMargin:
          type: string
          enum: [narrow, normal, wide]
        readerPageAnimation:
          type: string
          enum: [page, slide, none]
        readerZoom:
          type: integer

    AuthResponse:
