openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: BookMind Foundation API Specification (BM-PRD-02)
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: System health and readiness operations
  - name: auth
    description: Authentication and session operations
  - name: user
    description: User profile and preferences operations
  - name: books
    description: Books, reading progress, bookmarks and notes operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns liveness status
      responses:
        "200":
          description: Liveness healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Readiness check
      description: Returns readiness including database connection status
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: Service is degraded or unready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"

  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register new user
      description: Creates user account and issues initial auth session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error or user already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Login user
      description: Authenticates user credentials and issues session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Logout user
      description: Clears session cookie and invalidates session token
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /me:
    get:
      operationId: getCurrentUser
      tags: [user]
      summary: Get current authenticated user
      description: Returns user profile and current preferences
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/preferences:
    patch:
      operationId: updateUserPreferences
      tags: [user]
      summary: Update user preferences
      description: Modifies language, theme, reading mode or font size
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePreferencesRequest"
      responses:
        "200":
          description: Preferences updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books:
    get:
      operationId: getBooks
      tags: [books]
      summary: List user books
      description: Returns list of books in the user library with reading progress
      responses:
        "200":
          description: List of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/{bookId}:
    get:
      operationId: getBookDetails
      tags: [books]
      summary: Get book details
      description: Returns book metadata, pages, progress, bookmarks, and notes
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Book details with pages and annotations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetailResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteBook
      tags: [books]
      summary: Delete book
      description: Soft-deletes or removes book and stored original file
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Book successfully deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/{bookId}/progress:
    put:
      operationId: updateReadingProgress
      tags: [books]
      summary: Update reading progress
      description: Persists current page, percentage, and completion status
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReadingProgressRequest"
      responses:
        "200":
          description: Reading progress updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingProgress"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/{bookId}/bookmarks:
    get:
      operationId: getBookBookmarks
      tags: [books]
      summary: Get all bookmarks for a book
      description: Returns list of bookmarks created for this book
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of bookmarks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bookmark"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createBookmark
      tags: [books]
      summary: Create bookmark
      description: Creates a bookmark on a specific page
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookmarkRequest"
      responses:
        "201":
          description: Bookmark created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bookmark"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/{bookId}/bookmarks/{bookmarkId}:
    delete:
      operationId: deleteBookmark
      tags: [books]
      summary: Delete bookmark
      description: Removes a bookmark by ID
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
        - name: bookmarkId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bookmark deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Bookmark not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/{bookId}/notes:
    get:
      operationId: getBookNotes
      tags: [books]
      summary: Get notes for a book
      description: Returns list of notes, optionally filtered by pageNumber
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
        - name: pageNumber
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createNote
      tags: [books]
      summary: Create note
      description: Creates a page note or quote highlight
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteRequest"
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/{bookId}/notes/{noteId}:
    put:
      operationId: updateNote
      tags: [books]
      summary: Update note
      description: Edits note content or color tag
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
        - name: noteId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNoteRequest"
      responses:
        "200":
          description: Note updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Note not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteNote
      tags: [books]
      summary: Delete note
      description: Deletes note by ID
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
        - name: noteId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Note deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Note not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/import:
    post:
      operationId: importBookPdf
      tags: [books]
      summary: Import PDF book
      description: Uploads and ingests a PDF file into private user storage and creates a library book
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImportBookPdfRequest"
      responses:
        "201":
          description: Book successfully imported and ready for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBookResponse"
        "400":
          description: Invalid PDF format or validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate PDF already in library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: PDF exceeds maximum size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Corrupted or password protected PDF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/{bookId}/processing:
    get:
      operationId: getBookProcessingStatus
      tags: [books]
      summary: Get book processing status
      description: Returns the processing job state and progress for a book
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current processing status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingJobStatus"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/{bookId}/processing/{jobId}:
    get:
      operationId: getBookProcessingJobStatus
      tags: [books]
      summary: Get specific book processing job status
      description: Returns the status for a specific processing job ID
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Specific processing job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingJobStatus"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Job or book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/{bookId}/file:
    get:
      operationId: getBookFileMetadata
      tags: [books]
      summary: Get book original file metadata
      description: Returns file size, checksum, and storage information
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookFileMetadata"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: File or book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/{bookId}/original:
    get:
      operationId: downloadBookOriginalPdf
      tags: [books]
      summary: Stream original PDF file
      description: Streams the original ingested PDF with HTTP Range support
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full PDF stream
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "206":
          description: Partial Content (Range request)
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Book or file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/{bookId}/pages:
    get:
      operationId: getBookPages
      tags: [books]
      summary: Get all processed pages for a book
      description: Returns list of pages with metadata, text content, and classification
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of processed book pages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookPagesListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/{bookId}/pages/{pageNumber}:
    get:
      operationId: getBookPage
      tags: [books]
      summary: Get details and bounding boxes for a single page
      description: Returns page text, coordinates, preview url, and classification
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
        - name: pageNumber
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Page detail with coordinates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookPageDetail"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Page or book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/{bookId}/pages/{pageNumber}/preview:
    get:
      operationId: getBookPagePreview
      tags: [books]
      summary: Get rendered preview image for a page
      description: Streams rendered PNG/WebP preview image
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
        - name: pageNumber
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Preview image
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Preview image or book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/{bookId}/reprocess:
    post:
      operationId: reprocessBook
      tags: [books]
      summary: Reprocess book pages
      description: Re-runs extraction, classification, preview generation, and OCR idempotently
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReprocessBookRequest"
      responses:
        "202":
          description: Reprocessing job enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingJobStatus"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/{bookId}/processing/cancel:
    post:
      operationId: cancelBookProcessing
      tags: [books]
      summary: Cancel active processing job
      description: Cancels an in-progress or queued processing job for a book
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /notes:
    get:
      operationId: getGlobalNotes
      tags: [books]
      summary: Get all notes across books
      description: Returns paginated list of notes for the current user, optionally filtered by search or book
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: bookId
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Global notes list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalNotesResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/{bookId}/highlights:
    get:
      operationId: getBookHighlights
      tags: [books]
      summary: Get highlights for a book
      description: Returns list of highlights, optionally filtered by pageNumber
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
        - name: pageNumber
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of highlights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Highlight"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createHighlight
      tags: [books]
      summary: Create a highlight
      description: Creates a stable text anchor highlight on a page
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHighlightRequest"
      responses:
        "201":
          description: Highlight created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Highlight"
        "400":
          description: Invalid anchor or selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/{bookId}/highlights/{highlightId}:
    patch:
      operationId: updateHighlight
      tags: [books]
      summary: Update highlight
      description: Updates highlight color or category
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
        - name: highlightId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHighlightRequest"
      responses:
        "200":
          description: Highlight updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Highlight"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Highlight not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteHighlight
      tags: [books]
      summary: Delete highlight
      description: Soft-deletes a highlight
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
        - name: highlightId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Highlight deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Highlight not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/{bookId}/separators:
    get:
      operationId: getBookSeparators
      tags: [books]
      summary: Get separators for a book
      description: Returns list of user reading sections/separators
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of separators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Separator"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createSeparator
      tags: [books]
      summary: Create separator
      description: Creates a user-defined reading range / separator
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSeparatorRequest"
      responses:
        "201":
          description: Separator created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Separator"
        "400":
          description: Invalid page range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/{bookId}/separators/{id}:
    patch:
      operationId: updateSeparator
      tags: [books]
      summary: Update separator
      description: Updates title, page range, or color
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSeparatorRequest"
      responses:
        "200":
          description: Separator updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Separator"
        "400":
          description: Invalid page range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Separator not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSeparator
      tags: [books]
      summary: Delete separator
      description: Deletes a separator by ID
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Separator deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Separator not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
        timestamp:
          type: string
      required:
        - status

    ReadinessStatus:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
        timestamp:
          type: string
      required:
        - status
        - database

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        displayName:
          type: string
      required:
        - email
        - password

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: string
        createdAt:
          type: string
      required:
        - id
        - email

    UserPreferences:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        language:
          type: string
          enum: [es-MX, en-US]
        theme:
          type: string
          enum: [light, dark, system]
        readingMode:
          type: string
          enum: [standard, study, speed]
        fontSize:
          type: string
          enum: [small, medium, large, x-large]
        readerViewMode:
          type: string
          enum: [auto, reading, original]
        readerLayout:
          type: string
          enum: [single, double, continuous]
        readerTheme:
          type: string
          enum: [paper, sepia, night]
        readerFontFamily:
          type: string
          enum: [serif, sans]
        readerFontSize:
          type: integer
        readerLineHeight:
          type: string
          enum: [compact, normal, relaxed]
        readerMargin:
          type: string
          enum: [narrow, normal, wide]
        readerPageAnimation:
          type: string
          enum: [page, slide, none]
        readerZoom:
          type: integer
        updatedAt:
          type: string
      required:
        - id
        - userId
        - language
        - theme

    UpdatePreferencesRequest:
      type: object
      properties:
        language:
          type: string
          enum: [es-MX, en-US]
        theme:
          type: string
          enum: [light, dark, system]
        readingMode:
          type: string
          enum: [standard, study, speed]
        fontSize:
          type: string
          enum: [small, medium, large, x-large]
        readerViewMode:
          type: string
          enum: [auto, reading, original]
        readerLayout:
          type: string
          enum: [single, double, continuous]
        readerTheme:
          type: string
          enum: [paper, sepia, night]
        readerFontFamily:
          type: string
          enum: [serif, sans]
        readerFontSize:
          type: integer
        readerLineHeight:
          type: string
          enum: [compact, normal, relaxed]
        readerMargin:
          type: string
          enum: [narrow, normal, wide]
        readerPageAnimation:
          type: string
          enum: [page, slide, none]
        readerZoom:
          type: integer

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
        preferences:
          $ref: "#/components/schemas/UserPreferences"
      required:
        - user
        - token

    UserProfileResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        preferences:
          $ref: "#/components/schemas/UserPreferences"
      required:
        - user
        - preferences

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success

    ErrorDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
        - code
        - message

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          default: false
        error:
          $ref: "#/components/schemas/ErrorDetail"
      required:
        - success
        - error

    BookSummary:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        author:
          type: string
        totalPages:
          type: integer
        currentPage:
          type: integer
        progressPercent:
          type: integer
        coverUrl:
          type: string
        sourceType:
          type: string
        processingStatus:
          type: string
        lastReadAt:
          type: string
      required:
        - id
        - title
        - totalPages
        - currentPage
        - progressPercent

    BookPage:
      type: object
      properties:
        id:
          type: string
        bookId:
          type: string
        pageNumber:
          type: integer
        pageType:
          type: string
        rawText:
          type: string
        normalizedText:
          type: string
        textContent:
          type: string
        textSource:
          type: string
        characterCount:
          type: integer
        wordCount:
          type: integer
        ocrRequired:
          type: boolean
        ocrStatus:
          type: string
        ocrConfidence:
          type: number
          nullable: true
        qualityScore:
          type: integer
        width:
          type: integer
        height:
          type: integer
        rotation:
          type: integer
        previewUrl:
          type: string
        isBlank:
          type: boolean
      required:
        - id
        - bookId
        - pageNumber
        - textContent

    TextBlock:
      type: object
      properties:
        text:
          type: string
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
        confidence:
          type: number
      required:
        - text
        - x
        - y
        - width
        - height

    BookPageDetail:
      allOf:
        - $ref: "#/components/schemas/BookPage"
        - type: object
          properties:
            textBlocks:
              type: array
              items:
                $ref: "#/components/schemas/TextBlock"

    BookPagesListResponse:
      type: object
      properties:
        bookId:
          type: string
        totalPages:
          type: integer
        pages:
          type: array
          items:
            $ref: "#/components/schemas/BookPage"
      required:
        - bookId
        - totalPages
        - pages

    ReprocessBookRequest:
      type: object
      properties:
        forceOcr:
          type: boolean
        priority:
          type: string

    ReadingProgress:
      type: object
      properties:
        id:
          type: string
        bookId:
          type: string
        currentPage:
          type: integer
        progressPercent:
          type: integer
        completed:
          type: boolean
        lastReadAt:
          type: string
      required:
        - id
        - bookId
        - currentPage
        - progressPercent
        - completed

    UpdateReadingProgressRequest:
      type: object
      properties:
        currentPage:
          type: integer
          minimum: 1
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
        completed:
          type: boolean
      required:
        - currentPage

    Bookmark:
      type: object
      properties:
        id:
          type: string
        bookId:
          type: string
        pageNumber:
          type: integer
        title:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - bookId
        - pageNumber
        - createdAt

    CreateBookmarkRequest:
      type: object
      properties:
        pageNumber:
          type: integer
          minimum: 1
        title:
          type: string
      required:
        - pageNumber

    Note:
      type: object
      properties:
        id:
          type: string
        bookId:
          type: string
        pageNumber:
          type: integer
        highlightId:
          type: string
          nullable: true
        highlightText:
          type: string
          nullable: true
        selectedText:
          type: string
          nullable: true
        anchorData:
          $ref: "#/components/schemas/TextAnchor"
        content:
          type: string
        color:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - bookId
        - pageNumber
        - content
        - color
        - createdAt

    CreateNoteRequest:
      type: object
      properties:
        pageNumber:
          type: integer
          minimum: 1
        content:
          type: string
        highlightId:
          type: string
        highlightText:
          type: string
        selectedText:
          type: string
        anchorData:
          $ref: "#/components/schemas/TextAnchor"
        color:
          type: string
      required:
        - pageNumber
        - content

    UpdateNoteRequest:
      type: object
      properties:
        content:
          type: string
        color:
          type: string
      required:
        - content

    BookDetailResponse:
      type: object
      properties:
        book:
          $ref: "#/components/schemas/BookSummary"
        pages:
          type: array
          items:
            $ref: "#/components/schemas/BookPage"
        progress:
          $ref: "#/components/schemas/ReadingProgress"
        bookmarks:
          type: array
          items:
            $ref: "#/components/schemas/Bookmark"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/Note"
      required:
        - book
        - pages
        - bookmarks
        - notes

    BookFileMetadata:
      type: object
      properties:
        id:
          type: string
        bookId:
          type: string
        originalFilename:
          type: string
        filePath:
          type: string
        fileSizeBytes:
          type: integer
        mimeType:
          type: string
        checksumSha256:
          type: string
        storageProvider:
          type: string
        uploadStatus:
          type: string
        createdAt:
          type: string
      required:
        - id
        - bookId
        - originalFilename
        - filePath
        - fileSizeBytes
        - checksumSha256

    ProcessingJobStatus:
      type: object
      properties:
        id:
          type: string
        bookId:
          type: string
        jobType:
          type: string
        status:
          type: string
        bookStatus:
          type: string
        stage:
          type: string
        progress:
          type: integer
        processedPages:
          type: integer
        totalPages:
          type: integer
        attempt:
          type: integer
        errorCode:
          type: string
        errorMessageSafe:
          type: string
        summary:
          type: object
          additionalProperties: true
      required:
        - status
        - stage
        - progress

    ImportBookResponse:
      type: object
      properties:
        book:
          $ref: "#/components/schemas/BookSummary"
        file:
          $ref: "#/components/schemas/BookFileMetadata"
        job:
          $ref: "#/components/schemas/ProcessingJobStatus"
      required:
        - book
        - file

    ImportBookPdfRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: The PDF file to import
        title:
          type: string
          description: Optional title override
        author:
          type: string
          description: Optional author override
        language:
          type: string
          description: Optional language override
      required:
        - file

    BoundingBox:
      type: object
      properties:
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
      required:
        - x
        - y
        - width
        - height

    TextAnchor:
      type: object
      properties:
        anchorVersion:
          type: integer
          default: 1
        pageNumber:
          type: integer
        startBlockId:
          type: string
        startOffset:
          type: integer
        endBlockId:
          type: string
        endOffset:
          type: integer
        exactText:
          type: string
        prefixText:
          type: string
          nullable: true
        suffixText:
          type: string
          nullable: true
        textHash:
          type: string
      required:
        - anchorVersion
        - pageNumber
        - startBlockId
        - startOffset
        - endBlockId
        - endOffset
        - exactText
        - textHash

    Highlight:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        bookId:
          type: string
        pageNumber:
          type: integer
        anchorVersion:
          type: integer
        startBlockId:
          type: string
        startOffset:
          type: integer
        endBlockId:
          type: string
        endOffset:
          type: integer
        exactText:
          type: string
        prefixText:
          type: string
          nullable: true
        suffixText:
          type: string
          nullable: true
        textHash:
          type: string
        color:
          type: string
          enum: [yellow, green, blue, red, violet]
        category:
          type: string
          nullable: true
          enum: [important, learned, example, not_understood, review]
        anchorStatus:
          type: string
          enum: [resolved, recovered, needs_review, orphaned]
        boundingBoxes:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/BoundingBox"
        noteCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - userId
        - bookId
        - pageNumber
        - anchorVersion
        - startBlockId
        - startOffset
        - endBlockId
        - endOffset
        - exactText
        - textHash
        - color
        - anchorStatus
        - createdAt
        - updatedAt

    CreateHighlightRequest:
      type: object
      properties:
        pageNumber:
          type: integer
          minimum: 1
        startBlockId:
          type: string
        startOffset:
          type: integer
          minimum: 0
        endBlockId:
          type: string
        endOffset:
          type: integer
          minimum: 0
        exactText:
          type: string
          maxLength: 10000
        prefixText:
          type: string
        suffixText:
          type: string
        color:
          type: string
          default: yellow
          enum: [yellow, green, blue, red, violet]
        category:
          type: string
          enum: [important, learned, example, not_understood, review]
        boundingBoxes:
          type: array
          items:
            $ref: "#/components/schemas/BoundingBox"
      required:
        - pageNumber
        - startBlockId
        - startOffset
        - endBlockId
        - endOffset
        - exactText

    UpdateHighlightRequest:
      type: object
      properties:
