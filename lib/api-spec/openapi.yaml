        userId:
          type: string
        bookId:
          type: string
        bookTitle:
          type: string
        pageNumber:
          type: integer
        highlightId:
          type: string
          nullable: true
        selectedText:
          type: string
          nullable: true
        content:
          type: string
        color:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - bookId
        - bookTitle
        - pageNumber
        - content
        - color
        - createdAt
        - updatedAt

    GlobalNotesResponse:
      type: object
      properties:
        notes:
          type: array
          items:
            $ref: "#/components/schemas/GlobalNoteItem"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - notes
        - total

    Separator:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        bookId:
          type: string
        title:
          type: string
        startPage:
          type: integer
        endPage:
          type: integer
        color:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - userId
        - bookId
        - title
        - startPage
        - endPage
        - color
        - createdAt
        - updatedAt

    CreateSeparatorRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        startPage:
          type: integer
          minimum: 1
        endPage:
          type: integer
          minimum: 1
        color:
          type: string
          default: indigo
      required:
        - title
        - startPage
        - endPage

    UpdateSeparatorRequest:
      type: object
      properties:
        title:
          type: string
        startPage:
          type: integer
        endPage:
          type: integer
        color:
          type: string


